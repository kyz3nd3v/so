<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>KafeBot · Stock</title>
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --card-border: rgba(60, 60, 67, 0.08);
            --text: #1c1c1e;
            --text-secondary: #3a3a3c;
            --muted: #8e8e93;
            --accent: #007aff;
            --accent-pressed: #0066d9;
            --danger: #ff3b30;
            --success: #34c759;
            --gold: #ff9500;
            --radius: 14px;
            --shadow: 0 1px 6px rgba(0, 0, 0, 0.04), 0 2px 16px rgba(0, 0, 0, 0.04);
            --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            --input-bg: #f8f8fc;
            --modal-bg: #ffffff;
            --header-bg: transparent;
            --badge-bg: #f2f2f7;
            --divider: rgba(0, 0, 0, 0.06);
            --hover-bg: rgba(0, 0, 0, 0.04);
            --theme-transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        body.dark {
            --bg: #1c1c1e;
            --card: #2c2c2e;
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #f5f5f7;
            --text-secondary: #e5e5ea;
            --muted: #8e8e93;
            --accent: #0a84ff;
            --accent-pressed: #409cff;
            --shadow: 0 1px 6px rgba(0, 0, 0, 0.3), 0 2px 16px rgba(0, 0, 0, 0.2);
            --input-bg: #3a3a3c;
            --modal-bg: #2c2c2e;
            --badge-bg: #3a3a3c;
            --divider: rgba(255, 255, 255, 0.08);
            --hover-bg: rgba(255, 255, 255, 0.06);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            padding: 0 12px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            transition: var(--theme-transition);
        }

        .app {
            max-width: 480px;
            width: 100%;
            padding-top: 6px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 12px;
            margin-bottom: 14px;
            transition: var(--theme-transition);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
            letter-spacing: -0.2px;
            box-shadow: 0 2px 10px rgba(0, 122, 255, 0.18);
            transition: var(--theme-transition);
        }

        .header-info h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            line-height: 1.2;
            color: var(--text);
            transition: var(--theme-transition);
        }

        .header-info .sub {
            font-size: 12px;
            color: var(--muted);
            font-weight: 400;
            transition: var(--theme-transition);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clock {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 0.2px;
            font-variant-numeric: tabular-nums;
            background: var(--badge-bg);
            padding: 4px 12px;
            border-radius: 999px;
            border: 0.5px solid var(--divider);
            transition: var(--theme-transition);
        }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle {
            width: 52px;
            height: 30px;
            border-radius: 999px;
            background: var(--badge-bg);
            border: 0.5px solid var(--divider);
            cursor: pointer;
            position: relative;
            transition: var(--theme-transition);
            flex-shrink: 0;
            padding: 2px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .theme-toggle .thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .theme-toggle.dark .thumb {
            transform: translateX(22px);
            background: #f5f5f7;
            color: #1c1c1e;
        }

        .theme-toggle .thumb svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* ===== CARD ===== */
        .card {
            padding: 18px 16px 18px;
            margin-bottom: 14px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 0.5px solid var(--card-border);
            transition: var(--theme-transition);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            color: var(--text);
            transition: var(--theme-transition);
            letter-spacing: -0.2px;
        }

        .card-title .badge-count {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            background: var(--badge-bg);
            padding: 0 10px;
            border-radius: 999px;
            border: 0.5px solid var(--divider);
            transition: var(--theme-transition);
            line-height: 20px;
        }

        .card-desc {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
            line-height: 1.5;
            transition: var(--theme-transition);
            font-weight: 400;
        }

        .card-desc strong {
            color: var(--text);
            font-weight: 600;
            transition: var(--theme-transition);
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border: 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: transform 0.12s, background 0.2s, box-shadow 0.2s, color 0.2s, border-color 0.2s;
            width: 100%;
            letter-spacing: 0.1px;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 10px rgba(0, 122, 255, 0.2);
            transition: var(--theme-transition), transform 0.12s;
        }

        .btn-primary:hover {
            background: var(--accent-pressed);
        }

        .btn-secondary {
            background: var(--badge-bg);
            color: var(--text);
            border: 0.5px solid var(--divider);
            transition: var(--theme-transition), transform 0.12s;
            cursor: pointer;
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--hover-bg);
        }

        .btn-secondary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 2px 10px rgba(52, 199, 89, 0.2);
            transition: var(--theme-transition), transform 0.12s;
        }

        .btn-success:hover {
            background: #28a745;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 2px 10px rgba(255, 59, 48, 0.15);
            transition: var(--theme-transition), transform 0.12s;
        }

        .btn-danger:hover {
            background: #d63031;
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-gold {
            background: var(--gold);
            color: #fff;
            box-shadow: 0 2px 10px rgba(255, 149, 0, 0.2);
            transition: var(--theme-transition), transform 0.12s;
        }

        .btn-gold:hover {
            background: #e68a00;
        }

        .btn-whatsapp {
            background: #25d366;
            color: #fff;
            box-shadow: 0 2px 10px rgba(37, 211, 102, 0.2);
            transition: var(--theme-transition), transform 0.12s;
        }

        .btn-whatsapp:hover {
            background: #1da851;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 8px;
            font-weight: 500;
        }

        .btn-xs {
            padding: 4px 10px;
            font-size: 11px;
            width: auto;
            border-radius: 6px;
            font-weight: 500;
        }

        .btn-block {
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.45;
            pointer-events: none;
        }

        /* ===== PAGINATION CONTROLS ===== */
        .pagination-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            z-index: 5;
            position: relative;
        }

        .pagination-info {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
            min-width: 80px;
            text-align: center;
        }

        /* ===== SCROLL AREA ===== */
        .scroll-area {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .scroll-area::-webkit-scrollbar {
            width: 4px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: var(--badge-bg);
            border-radius: 99px;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: var(--muted);
            border-radius: 99px;
            opacity: 0.3;
        }

        /* ===== STOCK LIST ===== */
        .stock-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 0.5px solid var(--divider);
            transition: var(--theme-transition);
        }

        .stock-item:last-child {
            border-bottom: 0;
        }

        .stock-item .name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            transition: var(--theme-transition);
            letter-spacing: -0.1px;
        }

        .stock-item .qty-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 999px;
            background: var(--badge-bg);
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s, transform 0.12s, var(--theme-transition);
            border: 0.5px solid var(--divider);
            min-width: 40px;
            text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-variant-numeric: tabular-nums;
        }

        .stock-item .qty-badge:active {
            transform: scale(0.92);
            background: rgba(0, 122, 255, 0.08);
        }

        .stock-item .qty-badge.empty-stock {
            background: rgba(255, 59, 48, 0.12);
            color: var(--danger);
            border-color: rgba(255, 59, 48, 0.15);
            text-decoration: line-through;
        }

        .stock-item .actions {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .stock-item .actions .del {
            background: none;
            border: 0;
            color: var(--muted);
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.15s, transform 0.12s;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            font-weight: 300;
        }

        .stock-item .actions .del:active {
            transform: scale(0.88);
        }

        .stock-item .actions .del:hover {
            color: var(--danger);
        }

        .stock-item .actions .quick-empty {
            background: none;
            border: 1px solid var(--divider);
            border-radius: 4px;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
            line-height: 18px;
        }

        .stock-item .actions .quick-empty:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 59, 48, 0.05);
        }

        .stock-item .actions .quick-empty:active {
            transform: scale(0.92);
        }

        .empty-state {
            text-align: center;
            padding: 28px 10px;
            color: var(--muted);
            font-size: 14px;
            transition: var(--theme-transition);
            font-weight: 400;
        }

        .empty-state .big {
            font-size: 30px;
            display: block;
            margin-bottom: 6px;
            font-weight: 300;
            opacity: 0.4;
        }

        /* ===== ORDER LIST ===== */
        .order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 0.5px solid var(--divider);
            transition: var(--theme-transition);
        }

        .order-item:last-child {
            border-bottom: 0;
        }

        .order-item .name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            transition: var(--theme-transition);
            letter-spacing: -0.1px;
        }

        .order-item .qty {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            background: var(--badge-bg);
            padding: 2px 14px;
            border-radius: 999px;
            transition: var(--theme-transition);
            font-variant-numeric: tabular-nums;
        }

        .order-item .qty.empty-order {
            background: rgba(255, 59, 48, 0.12);
            color: var(--danger);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #fff;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            font-family: var(--font);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast.success {
            background: rgba(52, 199, 89, 0.92);
        }

        .toast.error {
            background: rgba(255, 59, 48, 0.92);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .pagination-info {
                font-size: 12px;
                min-width: 70px;
            }
            .btn-sm {
                padding: 5px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">📦</div>
                <div class="header-info">
                    <h1>KafeBot</h1>
                    <span class="sub">Stock Management</span>
                </div>
            </div>
            <div class="header-right">
                <div class="clock" id="clockDisplay">12:00</div>
                <button class="theme-toggle" id="themeToggle">
                    <div class="thumb">
                        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </div>
                </button>
            </div>
        </div>

        <!-- STOCK CARD WITH PAGINATION -->
        <div class="card">
            <div class="card-title">
                📊 Stock Items
                <span class="badge-count" id="stockCount">0</span>
            </div>
            <div class="card-desc">
                Tampilkan <strong id="pageStart">1</strong> sampai <strong id="pageEnd">18</strong> per slide
            </div>
            
            <!-- SCROLL AREA FOR STOCK ITEMS -->
            <div class="scroll-area" id="stockListContainer">
                <div id="stockList"></div>
            </div>

            <!-- PAGINATION BUTTONS -->
            <div class="pagination-controls">
                <button class="btn btn-sm btn-secondary" id="prevBtn" type="button">← Sebelumnya</button>
                <span class="pagination-info" id="pageInfo">Halaman 1</span>
                <button class="btn btn-sm btn-secondary" id="nextBtn" type="button">Berikutnya →</button>
            </div>
        </div>

        <!-- ORDER CARD -->
        <div class="card">
            <div class="card-title">
                🛒 Pesanan
                <span class="badge-count" id="orderCount">0</span>
            </div>
            <div class="scroll-area">
                <div id="orderList"></div>
            </div>
        </div>

        <!-- TOAST NOTIFICATION -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ===== PAGINATION STATE =====
        let currentPage = 1;
        const itemsPerPage = 18;
        let allItems = [];
        let filteredItems = [];
        let orders = {};

        // ===== THEME TOGGLE =====
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function updateTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (htmlElement.classList.contains('dark')) {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            } else {
                icon.innerHTML = '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
            }
        }

        themeToggle.addEventListener('click', updateTheme);

        // Load theme preference
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeToggle.classList.add('dark');
        }
        updateThemeIcon();

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clockDisplay').textContent = `${hours}:${minutes}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ===== STOCK DATA =====
        function initializeStockData() {
            const sampleItems = [];
            for (let i = 1; i <= 50; i++) {
                sampleItems.push({
                    id: i,
                    name: `Item ${i}`,
                    qty: Math.floor(Math.random() * 100),
                    category: i % 3 === 0 ? 'Kategori A' : i % 3 === 1 ? 'Kategori B' : 'Kategori C'
                });
            }
            allItems = sampleItems;
            filteredItems = [...allItems];
            updatePagination();
        }

        // ===== PAGINATION FUNCTIONS =====
        function updatePagination() {
            const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');
            const pageStart = document.getElementById('pageStart');
            const pageEnd = document.getElementById('pageEnd');

            // Disable/enable buttons
            if (prevBtn) prevBtn.disabled = currentPage === 1;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages;

            // Update page info
            if (pageInfo) pageInfo.textContent = `Halaman ${currentPage} dari ${totalPages}`;
            
            // Update display range
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredItems.length);
            if (pageStart) pageStart.textContent = start;
            if (pageEnd) pageEnd.textContent = end;

            displayItems();
        }

        function displayItems() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const itemsToDisplay = filteredItems.slice(start, end);
            const stockList = document.getElementById('stockList');
            const stockCount = document.getElementById('stockCount');

            stockCount.textContent = filteredItems.length;
            stockList.innerHTML = '';

            if (itemsToDisplay.length === 0) {
                stockList.innerHTML = '<div class="empty-state"><span class="big">📭</span>Tidak ada item</div>';
                return;
            }

            itemsToDisplay.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'stock-item';
                itemEl.innerHTML = `
                    <span class="name">${item.name}</span>
                    <span class="qty-badge">${item.qty}</span>
                    <div class="actions">
                        <button type="button" class="quick-empty" onclick="setQuantity(${item.id}, 0)">Kosong</button>
                        <button type="button" class="del" onclick="deleteItem(${item.id})">×</button>
                    </div>
                `;
                stockList.appendChild(itemEl);
            });
        }

        function nextSlide() {
            const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                updatePagination();
            }
        }

        function prevSlide() {
            if (currentPage > 1) {
                currentPage--;
                updatePagination();
            }
        }

        // Add event listeners to pagination buttons
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtn').addEventListener('click', prevSlide);

        // ===== ORDER FUNCTIONS =====
        function setQuantity(itemId, qty) {
            const item = allItems.find(i => i.id === itemId);
            if (item) {
                if (qty === 0) {
                    delete orders[itemId];
                } else {
                    orders[itemId] = { ...item, orderQty: qty };
                }
                displayOrders();
            }
        }

        function displayOrders() {
            const orderList = document.getElementById('orderList');
            const orderCount = document.getElementById('orderCount');
            const orderItems = Object.values(orders);

            orderCount.textContent = orderItems.length;
            orderList.innerHTML = '';

            if (orderItems.length === 0) {
                orderList.innerHTML = '<div class="empty-state"><span class="big">🛒</span>Belum ada pesanan</div>';
                return;
            }

            orderItems.forEach(order => {
                const itemEl = document.createElement('div');
                itemEl.className = 'order-item';
                itemEl.innerHTML = `
                    <span class="name">${order.name}</span>
                    <span class="qty">${order.orderQty} pcs</span>
                `;
                orderList.appendChild(itemEl);
            });
        }

        function deleteItem(itemId) {
            allItems = allItems.filter(i => i.id !== itemId);
            filteredItems = filteredItems.filter(i => i.id !== itemId);
            currentPage = 1;
            updatePagination();
            showToast('Item dihapus', 'success');
        }

        // ===== TOAST FUNCTIONS =====
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            initializeStockData();
        });
    </script>
</body>
</html>
